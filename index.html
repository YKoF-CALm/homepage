<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Split layout · top + bottom (bottom vertically split)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- TOP SECTION -->
  <header class="top-section">
    <h1>TOP SECTION</h1>
    <p>Full width · flexible height · sits above everything</p>
  </header>

  <!-- BOTTOM SECTION (vertically split into left + right) -->
  <div class="bottom-section">
    <!-- LEFT PANEL -->
    <div class="bottom-left">
      <div class="icon">◀</div>
      <h2>LEFT PANEL</h2>
      <p>Bottom section, left half. Background distinct, divider visible.</p>
    </div>

    <!-- RIGHT PANEL -->
    <div class="bottom-right">
      <div class="icon">▶</div>
      <h2>RIGHT PANEL</h2>
      <p>Bottom section, right half. Vertical split is clean and responsive.</p>
    </div>
  </div>

</body>
</html>
